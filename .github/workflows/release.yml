name: Release

# Publish a release: push a tag like v0.2.0, OR run this workflow manually (Actions → Release →
# Run workflow) — then the tag v<package.json version> is created for you. Publishes:
#   - lexbg.tgz            installable with: npx -y https://github.com/StanK1/lexbg-mcp/releases/latest/download/lexbg.tgz
#   - lexbg-research-skill.zip   the Claude skill
#   - ghcr.io/stank1/lexbg       Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Pack
        run: |
          npm pack
          mv lexbg-*.tgz lexbg.tgz
          (cd skills && zip -r ../lexbg-research-skill.zip lexbg-research)
      - name: Install the tarball like a user would
        run: |
          mkdir -p /tmp/try && cd /tmp/try
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/lexbg.tgz"
          test -f node_modules/lexbg/dist/src/index.js
          test -f node_modules/lexbg/sources/laws.yml
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lexbg.tgz lexbg-research-skill.zip --clobber
          else
            gh release create "$TAG" lexbg.tgz lexbg-research-skill.zip --target "$GITHUB_SHA" \
              --title "LexBG $TAG" --generate-notes --latest
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # needed to build the arm64 (Apple Silicon) image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")"; fi
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "tags=ghcr.io/stank1/lexbg:${v},ghcr.io/stank1/lexbg:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/stank1/lexbg:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
