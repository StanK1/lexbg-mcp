# LexBG — compliance topic packs.
#
# A topic pack is a curated *map*, not legal advice: which laws matter for a topic,
# which search phrases find the relevant provisions, and which questions people usually ask.
# It deliberately contains NO article numbers, thresholds, deadlines or amounts —
# those are always retrieved live from the law texts in the database, verbatim, with citations.
#
# applies_if: the topic is suggested by `compliance_checklist` when ANY condition matches.
#   entity_type: [person, freelancer, ET, EOOD, OOD, AD, NGO, other]
#   has_employees / processes_personal_data / sells_to_consumers / sells_online: true
#   vat_status: [registered, unsure]
#   aml_obliged: [yes, unsure]
#   sector: [finance, payments, investment, crypto, credit, accounting, real_estate, legal, gambling, critical_infrastructure, digital, other]
#   always: true

topics:
  - id: company-formation
    title: Регистрация и управление на фирма
    title_en: Company formation and corporate housekeeping
    summary: >-
      Видове търговци и дружества, учредяване и вписване в Търговския регистър, управление,
      капитал, обявяване на актове и електронни документи и подписи.
    laws: [tz, ztrrjlnc, zjlnc, zmsp, zedeuu]
    eu: [32014R0910]
    queries:
      - вписване на търговец в търговския регистър
      - дружество с ограничена отговорност капитал
      - едноличен търговец
      - управител на дружеството
      - учредителен акт дружествен договор
      - обявяване на годишния финансов отчет в търговския регистър
      - квалифициран електронен подпис
    questions:
      - Каква правна форма да избера – ЕТ, ЕООД или ООД?
      - Какво се подава за регистрация на фирма и къде?
      - Какви задължения има управителят на дружество?
    applies_if:
      - entity_type: [ET, EOOD, OOD, AD, NGO]

  - id: accounting
    title: Счетоводство и финансови отчети
    title_en: Accounting and financial statements
    summary: >-
      Задължения за счетоводно отчитане, счетоводни документи, категории предприятия,
      годишни финансови отчети, публикуване, съхраняване на информация и независим одит.
    laws: [zsch, znfo]
    eu: [32013L0034, 32022L2464]
    queries:
      - годишен финансов отчет съставяне
      - публикуване на годишните финансови отчети
      - съхраняване на счетоводната информация
      - микропредприятия малки средни и големи предприятия
      - счетоводен документ реквизити
      - независим финансов одит задължение
      - инвентаризация на активите и пасивите
    questions:
      - Трябва ли фирмата ми да публикува годишен финансов отчет и до кога?
      - Колко време трябва да пазя счетоводните документи?
      - Подлежи ли дружеството ми на задължителен одит?
    applies_if:
      - entity_type: [ET, EOOD, OOD, AD, NGO]

  - id: corporate-tax
    title: Корпоративен данък
    title_en: Corporate income tax
    summary: >-
      Облагане на печалбата на дружествата, данъчен финансов резултат, авансови вноски,
      годишна декларация и данък при източника.
    laws: [zkpo]
    eu: []
    queries:
      - данъчна ставка корпоративен данък
      - годишна данъчна декларация корпоративен данък
      - авансови вноски
      - данък при източника
      - данъчен финансов резултат
      - разходи които не са документално обосновани
    questions:
      - Каква е ставката на корпоративния данък?
      - Кога се подава годишната данъчна декларация по ЗКПО?
      - Дължа ли авансови вноски?
    applies_if:
      - entity_type: [EOOD, OOD, AD]

  - id: personal-income-tax
    title: Данък върху доходите на физическите лица
    title_en: Personal income tax
    summary: >-
      Облагане на доходите на физическите лица – от трудови правоотношения, свободна професия,
      наем, дивиденти – годишна декларация, авансов данък и удържане от платеца.
    laws: [zddfl]
    eu: []
    queries:
      - годишна данъчна декларация физически лица
      - доходи от упражняване на свободна професия
      - нормативно признати разходи
      - данък върху дивидентите
      - авансов данък
      - удържане и внасяне на данъка от работодателя
    questions:
      - Как се облагат доходите ми като фрийлансър?
      - Кога и как се подава годишната данъчна декларация за доходите ми?
      - Как се облагат дивидентите, които получавам от фирмата си?
    applies_if:
      - entity_type: [person, freelancer, ET]
      - has_employees: true

  - id: vat
    title: ДДС
    title_en: Value added tax
    summary: >-
      Регистрация по ЗДДС (задължителна и доброволна), облагаеми доставки, фактуриране,
      данъчен кредит, справки-декларации и продажби от разстояние в ЕС.
    laws: [zdds]
    eu: [32006L0112]
    queries:
      - задължителна регистрация по ЗДДС облагаем оборот
      - регистрация по избор
      - данъчна фактура съдържание
      - справка-декларация и дневници
      - дистанционни продажби на стоки
      - право на приспадане на данъчен кредит
      - ставка на данъка
    questions:
      - Кога съм длъжен да се регистрирам по ДДС?
      - Какво трябва да съдържа една фактура?
      - Как работи ДДС при онлайн продажби към клиенти в ЕС?
    applies_if:
      - vat_status: [registered, unsure]
      - sells_online: true

  - id: tax-procedure
    title: Данъчна процедура и НАП
    title_en: Tax procedure and the National Revenue Agency
    summary: >-
      Регистрация пред НАП, подаване на декларации, ревизии, обжалване, давност,
      лихви за просрочие и административни нарушения и наказания.
    laws: [dopk, zann]
    eu: []
    queries:
      - регистрация в Националната агенция за приходите
      - ревизия
      - обжалване на ревизионен акт
      - давност за данъчни задължения
      - лихви за просрочени задължения
      - фискално устройство
      - обжалване на наказателно постановление
    questions:
      - Какво се случва при ревизия от НАП?
      - Как се обжалва ревизионен акт?
      - Кога се погасяват по давност данъчните задължения?
    applies_if:
      - always: true

  - id: local-taxes
    title: Местни данъци и такси
    title_en: Local taxes and fees
    summary: >-
      Данък върху недвижимите имоти, данък при придобиване, данък върху превозните средства,
      такса за битови отпадъци, патентен данък и декларации към общината.
    laws: [zmdt]
    eu: []
    queries:
      - данък върху недвижимите имоти
      - данък върху превозните средства
      - такса за битови отпадъци
      - декларация при придобиване на имот
      - патентен данък
    questions:
      - Какви местни данъци дължа за имот или кола?
      - Трябва ли да подам декларация в общината след покупка на имот?
    applies_if:
      - always: true

  - id: social-security
    title: Социално и здравно осигуряване
    title_en: Social security and health insurance
    summary: >-
      Задължително осигуряване на работници, самоосигуряващи се лица и управители,
      осигурителен доход, вноски, декларации и здравно осигуряване.
    laws: [kso, zzo]
    eu: []
    queries:
      - задължително осигуряване самоосигуряващи се лица
      - осигурителен доход
      - осигурителни вноски за сметка на осигурителя
      - здравноосигурителни вноски
      - управители и съдружници осигуряване
      - подаване на данни за осигурените лица
    questions:
      - Как се осигурявам като управител/собственик на фирма?
      - Какви осигуровки дължа като самоосигуряващо се лице?
      - Какви са задълженията ми като работодател за осигуровки?
    applies_if:
      - entity_type: [freelancer, ET, EOOD, OOD, AD]
      - has_employees: true

  - id: employment
    title: Трудово право и наемане на служители
    title_en: Employment and hiring
    summary: >-
      Трудов договор и уведомяване на НАП, работно време, отпуски, заплащане,
      прекратяване, обезщетения, безопасни условия на труд и недискриминация.
    laws: [kt, zzbut, zzdiskr]
    eu: []
    queries:
      - трудов договор писмена форма
      - уведомление до Националната агенция за приходите за трудов договор
      - платен годишен отпуск
      - работно време извънреден труд
      - прекратяване на трудовия договор с предизвестие
      - обезщетения при прекратяване
      - оценка на риска за здравето и безопасността
    questions:
      - Какво трябва да направя преди служителят да започне работа?
      - Колко дни платен годишен отпуск се полагат?
      - Как се прекратява трудов договор и какви обезщетения се дължат?
    applies_if:
      - has_employees: true

  - id: aml
    title: Мерки срещу изпирането на пари
    title_en: Anti-money laundering
    summary: >-
      Задължени субекти, комплексна проверка на клиента, действителен собственик,
      вътрешни правила, уведомяване за съмнителни операции и видни политически личности.
    laws: [zmip, zmft]
    eu: [32015L0849, 32024R1624]
    queries:
      - задължени субекти по закона за мерките срещу изпирането на пари
      - комплексна проверка на клиента
      - действителен собственик
      - вътрешни правила за контрол и предотвратяване на изпирането на пари
      - уведомяване при съмнение за изпиране на пари
      - видни политически личности
      - плащане в брой
    questions:
      - Задължен субект ли съм по ЗМИП?
      - Какво включва комплексната проверка на клиента?
      - Трябва ли да декларирам действителния собственик на фирмата?
    applies_if:
      - aml_obliged: [yes, unsure]
      - sector: [finance, payments, investment, crypto, credit, accounting, real_estate, legal, gambling]
      - entity_type: [EOOD, OOD, AD]

  - id: data-protection
    title: Защита на личните данни
    title_en: Data protection (GDPR)
    summary: >-
      Задължения на администратора и обработващия, длъжностно лице по защита на данните,
      права на субектите, нарушения на сигурността, видеонаблюдение и надзор от КЗЛД.
    laws: [zzld]
    eu: [32016R0679, 32024R1689]
    queries:
      - администратор на лични данни задължения
      - длъжностно лице по защита на данните
      - видеонаблюдение
      - нарушение на сигурността на личните данни уведомяване
      - срок за съхранение на личните данни
      - единен граждански номер обработване
      - права на субекта на данни
    questions:
      - Какво трябва да направя, ако фирмата ми обработва лични данни на клиенти?
      - Трябва ли ми длъжностно лице по защита на данните?
      - Какво правя при изтичане на лични данни?
    applies_if:
      - processes_personal_data: true

  - id: consumer-ecommerce
    title: Потребители и онлайн търговия
    title_en: Consumers and e-commerce
    summary: >-
      Информация към потребителите, договори от разстояние и право на отказ, рекламации и
      гаранции, нелоялни практики, обявяване на цени, електронна търговия и потребителски кредит.
    laws: [zzp, zet, zpk, zzd, zedeuu]
    eu: [32011L0083, 32022R2065, 32014R0910]
    queries:
      - право на отказ от договор от разстояние
      - рекламация на стока
      - търговска гаранция и съответствие на стоката с договора
      - информация преди сключване на договор от разстояние
      - непоискани търговски съобщения
      - нелоялни търговски практики
      - обявяване на цените
    questions:
      - Какво трябва да пише в онлайн магазина ми задължително?
      - Колко време има клиентът да върне стока, купена онлайн?
      - Как се приема и обработва рекламация?
    applies_if:
      - sells_to_consumers: true
      - sells_online: true

  - id: financial-services
    title: Финансови услуги и надзор
    title_en: Financial services and supervision
    summary: >-
      Лицензиране и надзор на банки и инвестиционни посредници, потребителски кредит,
      оперативна устойчивост (DORA), криптоактиви и изкуствен интелект във финансите.
    laws: [zki, zpfi, zpk]
    eu: [32022R2554, 32013R0575, 32023R1114, 32024R1689]
    queries:
      - лиценз за извършване на банкова дейност
      - надзор от Българската народна банка
      - инвестиционен посредник лиценз
      - оценка на кредитоспособността на потребителя
      - инциденти свързани с информационните и комуникационните технологии
      - криптоактиви
    questions:
      - Нужен ли ми е лиценз за финансовата услуга, която искам да предлагам?
      - Какви са изискванията към банките за управление на ИКТ рискове?
    applies_if:
      - sector: [finance, investment, crypto, credit]

  - id: payments
    title: Платежни услуги
    title_en: Payment services
    summary: >-
      Платежни институции и дружества за електронни пари, лицензиране, задълбочено установяване
      на идентичността на клиента, отговорност при неразрешени операции и платежни сметки.
    laws: [zpups]
    eu: [32015L2366]
    queries:
      - лиценз за платежна институция
      - дружество за електронни пари
      - задълбочено установяване на идентичността на клиента
      - неразрешени платежни операции отговорност
      - платежна сметка за основни операции
    questions:
      - Трябва ли ми лиценз, за да приемам плащания за други?
      - Кой носи отговорност при неразрешено плащане?
    applies_if:
      - sector: [payments, finance]

  - id: cybersecurity
    title: Киберсигурност
    title_en: Cybersecurity (NIS2)
    summary: >-
      Задължения на съществени и важни субекти, мерки за управление на риска,
      уведомяване за инциденти и надзор по националния закон и NIS2/DORA.
    laws: [zks]
    eu: [32022L2555, 32022R2554]
    queries:
      - съществени и важни субекти
      - уведомяване за инцидент
      - мерки за управление на рисковете за киберсигурността
      - мрежова и информационна сигурност
    questions:
      - Попада ли фирмата ми под закона за киберсигурност?
      - До кога трябва да уведомя за киберинцидент?
    applies_if:
      - sector: [critical_infrastructure, digital, finance, payments]

  - id: euro-changeover
    title: Въвеждане на еврото
    title_en: Euro changeover
    summary: >-
      Правила за въвеждането на еврото – превалутиране на суми и договори, закръгляване,
      обявяване на цени, счетоводство и капитал на дружествата.
    laws: [zveurb]
    eu: [31998R0974]
    queries:
      - двойно обозначаване на цените
      - превалутиране
      - фиксиран курс
      - закръгляване
      - капитал на дружествата в евро
      - счетоводна отчетност в евро
    questions:
      - Какво трябва да променя във фирмата заради въвеждането на еврото?
      - Как се превалутират договорите и капиталът?
    applies_if:
      - always: true

  - id: citizens-rights
    title: Права на гражданите
    title_en: Citizens' rights
    summary: >-
      Основни права и свободи по Конституцията, достъп до обществена информация, защита от
      дискриминация, договори и неустойки, права на потребителите и обжалване на глоби.
    laws: [constitution, zdoi, zzdiskr, zzd, zann, zzp]
    eu: []
    queries:
      - основни права и задължения на гражданите
      - заявление за достъп до обществена информация
      - защита от дискриминация
      - обжалване на наказателно постановление
      - неустойка
      - право на жалба
    questions:
      - Как да поискам информация от държавна институция?
      - Как да обжалвам глоба?
      - Какви права имам, ако съм дискриминиран?
    applies_if:
      - entity_type: [person]

  - id: whistleblowing
    title: Подаване на сигнали за нарушения
    title_en: Whistleblowing
    summary: >-
      Задължени субекти, вътрешни канали за сигнали, регистър на сигналите и защита на
      лицата, подаващи сигнали. Кои работодатели са задължени зависи от прага в закона.
    laws: [zzlpspoin]
    eu: [32019L1937]
    queries:
      - канал за вътрешно подаване на сигнали
      - задължени субекти работодатели
      - защита на лицата подаващи сигнали
      - регистър на сигналите
    questions:
      - Длъжен ли съм като работодател да имам канал за сигнали?
      - Как трябва да се обработи подаден сигнал?
    applies_if:
      - has_employees: true
