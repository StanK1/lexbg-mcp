# LexBG — registry of Bulgarian laws tracked by the server.
#
# Fields
#   id          stable identifier used in tool calls (latin, lowercase)
#   short       common Bulgarian abbreviation
#   title       exact official title (used to find the original act on parliament.bg)
#   base_titles extra exact titles the law had over time (renamed laws)
#   genitive    the form used in amending acts: "Закон за изменение на <genitive>",
#               "§ 5. В <genitive> (обн., ДВ ...) се правят следните изменения"
#   genitives   extra genitive forms (former names)
#   aliases     other names users type (English names, variants)
#   topics      topic pack ids from sources/topics.yml
#
# Text sources, in order of preference (see DATA_SOURCES.md):
#   1. data/manual/<id>.html|.txt  — consolidated text you downloaded from an OFFICIAL source
#   2. the original promulgated act on parliament.bg (only for laws adopted since ~2005)
#   Amendments are always tracked from parliament.bg, so `what_changed` works for every law.

laws:
  - id: constitution
    short: КРБ
    title: Конституция на Република България
    genitive: Конституцията на Република България
    aliases: [конституция, constitution, конституцията]
    topics: [citizens-rights]

